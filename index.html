*{box-sizing:border-box;min-width:0}

.hint{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:13px;color:var(--muted)}
#err{display:none;padding:20px;text-align:center;color:var(--muted)}
.page{container-type:inline-size}
.sb{position:absolute;--u:calc(100cqw / 794);background:#3D1F6B;color:#fff;box-sizing:border-box;padding:calc(var(--u)*22) calc(var(--u)*18);display:flex;flex-direction:column;gap:calc(var(--u)*4);font-family:"Noto Sans KR",sans-serif;pointer-events:none}

.sb .r{display:flex;justify-content:space-between;gap:calc(var(--u)*8);padding:calc(var(--u)*8) 0;border-bottom:1px solid #5A3D86;font-size:calc(var(--u)*12)}
.sb .r span:first-child{color:#CBBBE3;flex:none}.sb .r span:last-child{font-weight:500;text-align:right}
.sb .a{font-size:calc(var(--u)*12);color:#E4DAF2;line-height:1.9}
.sb .n{margin-top:auto;font-size:calc(var(--u)*11);line-height:1.6;color:#CBBBE3}
dialog{border:none;border-radius:14px;padding:0;width:min(560px,94vw);max-height:90vh;color:#241B33;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(20,11,38,.55)}
.dlg{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:18px;color:#2A1150}
.dlg label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#5E5270}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dlg .acts{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.dlg .msg{font-size:13px;color:#5E5270;min-height:18px}
.ghost{background:#fff;color:#2A1150;border-color:#cfc3e2}

  #first,#last{display:none}
  .hint{font-size:11px;bottom:2px}
}
